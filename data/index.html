<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Freddy Radar</title>
  <style>
    body {
      font-family: ui-monospace, Menlo, monospace;
      background: #111;
      color: #ddd;
      margin: 0;
    }

    /* Top half: status. Bottom half: radar view. */
    #status-panel {
      height: 50vh;
      height: 50dvh;
      overflow: auto;
      padding: 12px;
      box-sizing: border-box;
    }
    #radar-canvas {
      display: block;
      width: 100%;
      height: 50vh;
      height: 50dvh;
      background: #000;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    #connection-status {
      font-size: 12px;
      color: #888;
    }

    /* One column per sensor, side by side (radar 0 left, radar 1 right like the scope) */
    #sensor-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sensor-column {
      min-width: 0; /* let the gate table scroll instead of widening the column */
    }

    /* Sensor tile: state is shown by color only. Brightness = activity, like the scope. */
    .sensor-tile {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      font-weight: bold;
      text-align: center;
      color: #777;
      background: #222; /* unknown: page not connected to the ESP32 */
    }
    .sensor-tile.offline {   /* no data from the radar: a real fault */
      color: #ff6b6b;
      background: #3a1010;
      border-color: #a33;
    }
    .sensor-tile.idle {      /* connected, nobody there: armed / standing by */
      color: #2f8f4a;
      background: #071a0d;
      border-color: #1f5f31;
    }
    .sensor-tile.stationary, /* someone is there, not moving: bright green */
    .sensor-tile.moving {     /* someone is there and moving: bright green + blinking stroke */
      color: #000;
      background: #33ff66;
      border-color: #33ff66;
      box-shadow: 0 0 12px #33ff66;
    }
    .sensor-tile.moving {
      animation: stroke-blink 0.15s steps(1) infinite;
    }
    @keyframes stroke-blink {
      50% {
        border-color: #ccffd9;
        box-shadow: 0 0 0 3px #ccffd9, 0 0 18px #ccffd9;
      }
    }

    pre {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.3;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div id="status-panel">
    <h1>Freddy Radar <span id="connection-status">connecting…</span></h1>
    <div id="sensor-columns"></div>
  </div>
  <canvas id="radar-canvas"></canvas>

  <script>
    // ---------- Status panel ----------

    const GATE_SIZE_METERS = 0.75;
    const ENERGY_BAR_LENGTH = 8; // energy 0..100 -> 0..8 '#' characters (fits half a phone screen)

    function energyBar(energy) {
      const filled = Math.round(energy / (100 / ENERGY_BAR_LENGTH));
      return '#'.repeat(filled).padEnd(ENERGY_BAR_LENGTH, '.');
    }

    // offline (no UART data), moving, stationary, or idle (connected, nobody there).
    // OUT pin high also counts as presence, as a backup to the UART data.
    function sensorState(radar) {
      if (!radar.online) return 'offline';
      if (radar.moving) return 'moving';
      if (radar.presence || radar.out) return 'stationary';
      return 'idle';
    }

    function renderGateTable(radar) {
      let table = 'dist moving   stationary\n';
      for (let gate = 0; gate < radar.mGates.length; gate++) {
        const distance = (gate * GATE_SIZE_METERS).toFixed(2);
        table += `${distance} ${energyBar(radar.mGates[gate])} ${energyBar(radar.sGates[gate])}\n`;
      }
      return table;
    }

    function renderDetails(radar) {
      const firmwareText = radar.fw || 'unknown (reset board after connecting radar)';
      if (!radar.online) return `<pre>OUT pin    ${+radar.out}
firmware   ${firmwareText}</pre>`;
      const movingText = radar.moving ? `${radar.mDist}cm e${radar.mSig}` : '-';
      const stationaryText = radar.stationary ? `${radar.sDist}cm e${radar.sSig}` : '-';
      const gateTable = radar.mGates.length ? renderGateTable(radar) : '';
      return `<pre>moving     ${movingText}
stationary ${stationaryText}
OUT pin    ${+radar.out}
firmware   ${firmwareText}

${gateTable}</pre>`;
    }

    const RADAR_NAMES = ['Left Radar', 'Right Radar']; // indexed by radar id

    function radarTitle(radar) {
      const name = RADAR_NAMES[radar.id] || 'Radar';
      return `${name} (R${radar.id})`;
    }

    // Columns are built once and then updated in place: re-creating the tiles
    // every message would restart the blink animation before it is ever visible.
    function buildSensorColumns(radars) {
      document.getElementById('sensor-columns').innerHTML = radars.map(radar => `
        <div class="sensor-column">
          <div class="sensor-tile" id="sensor-tile-${radar.id}">${radarTitle(radar)}</div>
          <div id="sensor-details-${radar.id}"></div>
        </div>`).join('');
    }

    function updateSensorColumn(radar) {
      const tile = document.getElementById(`sensor-tile-${radar.id}`);
      const tileClass = `sensor-tile ${sensorState(radar)}`;
      if (tile.className !== tileClass) tile.className = tileClass;
      document.getElementById(`sensor-details-${radar.id}`).innerHTML = renderDetails(radar);
    }

    let latestStatus = null; // last message from the ESP32, also used by the radar view

    function renderStatus(status) {
      latestStatus = status;
      if (document.querySelectorAll('.sensor-column').length !== status.radars.length) {
        buildSensorColumns(status.radars);
      }
      status.radars.forEach(updateSensorColumn);
    }

    // ---------- WebSocket connection to the ESP32 ----------

    const RECONNECT_DELAY_MS = 1000;
    // The ESP32 pushes every 100 ms. If nothing arrives for this long, treat it as gone:
    // the browser's own close event can take a minute when the board just loses power.
    const STALE_AFTER_MS = 1500;
    const STALE_CHECK_MS = 250;

    const connectionStatus = document.getElementById('connection-status');
    let socket = null;
    let lastMessageMs = 0;

    function connect() {
      socket = new WebSocket(`ws://${location.host}/ws`);
      lastMessageMs = Date.now(); // gives a new connection STALE_AFTER_MS to deliver data

      socket.onopen = () => {
        connectionStatus.textContent = 'live';
      };
      socket.onmessage = (event) => {
        lastMessageMs = Date.now();
        renderStatus(JSON.parse(event.data));
      };
      socket.onclose = dropConnection;
    }

    function dropConnection() {
      // Detach the old socket so its late events can't trigger a second reconnect.
      socket.onopen = socket.onmessage = socket.onclose = null;
      socket.close();
      socket = null;

      connectionStatus.textContent = 'reconnecting…';
      // Sensor state is unknown while disconnected: show tiles as gray.
      document.querySelectorAll('.sensor-tile').forEach(tile => tile.className = 'sensor-tile');
      latestStatus = null; // stop adding new targets
      setTimeout(connect, RECONNECT_DELAY_MS);
    }

    setInterval(() => {
      if (socket && Date.now() - lastMessageMs > STALE_AFTER_MS) dropConnection();
    }, STALE_CHECK_MS);

    connect();

    // ---------- Radar view: old-style sweep scope ----------

    // Angles are compass-style: 0deg = up, clockwise.
    // Each radar covers a 120deg section; the sections overlap between 355 and 5.
    // Each section has its own ray sweeping outer edge -> inner edge -> back; the two rays
    // move in sync and meet in the overlap. Solid border = outer edge, dashed = inner edge.
    // A target is always drawn on its section's detection angle (the radar has no angle info).
    const RADAR_SECTIONS = [
      { outerDeg: 245, innerDeg: 5,   detectionDeg: 305 }, // radar 0 (left)
      { outerDeg: 115, innerDeg: 355, detectionDeg: 55  }, // radar 1 (right)
    ];

    const SWEEP_PERIOD_MS = 1600; // one pass outer -> inner (or back)
    const SWEEP_TRAIL_DEG = 30;   // fading glow behind each ray

    const RANGE_RINGS = 5;
    const DISTANCE_STEPS = 10;    // targets snap to 10 distances
    const MAX_RANGE_CM = 9 * 75;  // 9 gates x 0.75 m = edge of the scope
    const BLIP_MIN_RADIUS_PX = 4;  // signal 0
    const BLIP_MAX_RADIUS_PX = 12; // signal 100
    const BLIP_FADE_MS = SWEEP_PERIOD_MS; // fades over one pass

    const SCOPE_GREEN = '51, 255, 102'; // r, g, b — combined with alpha below
    const CIRCLE_MARGIN_PX = 10;

    function green(alpha) {
      return `rgba(${SCOPE_GREEN}, ${alpha})`;
    }

    // Canvas measures angles from the right (east); compass measures from the top.
    function compassToCanvasRadians(degrees) {
      return (degrees - 90) * Math.PI / 180;
    }

    // Signed shortest turn between compass angles: -180..180, positive = clockwise.
    function turnDeg(fromDeg, toDeg) {
      return ((toDeg - fromDeg + 540) % 360) - 180;
    }

    // A ray's position is its "travel": 0 = section's outer edge, 1 = inner edge.
    function rayAngleDeg(section, travel) {
      return section.outerDeg + turnDeg(section.outerDeg, section.innerDeg) * travel;
    }

    function travelAt(section, compassDeg) {
      return turnDeg(section.outerDeg, compassDeg) / turnDeg(section.outerDeg, section.innerDeg);
    }

    // 1..DISTANCE_STEPS, where DISTANCE_STEPS is the edge of the scope.
    function distanceStep(distanceCm) {
      const step = Math.ceil(distanceCm / MAX_RANGE_CM * DISTANCE_STEPS);
      return Math.min(Math.max(step, 1), DISTANCE_STEPS);
    }

    // ---- Targets ("blips"): added when the ray crosses a detecting sensor's angle ----

    const blips = []; // { angleDeg, step, radiusPx, bornMs }

    function addBlipsCrossed(previousTravel, travel, now) {
      if (!latestStatus) return;
      RADAR_SECTIONS.forEach((section, radarId) => {
        const detectionTravel = travelAt(section, section.detectionDeg);
        const rayCrossed = Math.min(previousTravel, travel) < detectionTravel &&
                           detectionTravel <= Math.max(previousTravel, travel); // either direction
        const radar = latestStatus.radars.find(r => r.id === radarId);
        if (!rayCrossed || !radar || !radar.online || !radar.presence) return;

        // Same marker for moving and stationary targets.
        const distanceCm = radar.moving ? radar.mDist : radar.sDist;
        const signal = Math.min(radar.moving ? radar.mSig : radar.sSig, 100);
        blips.push({
          angleDeg: section.detectionDeg,
          step: distanceStep(distanceCm),
          radiusPx: BLIP_MIN_RADIUS_PX + (BLIP_MAX_RADIUS_PX - BLIP_MIN_RADIUS_PX) * signal / 100,
          bornMs: now,
        });
      });
    }

    // ---- Drawing ----

    function drawLineFromCenter(context, scope, compassDeg) {
      const angle = compassToCanvasRadians(compassDeg);
      context.beginPath();
      context.moveTo(scope.centerX, scope.centerY);
      context.lineTo(scope.centerX + Math.cos(angle) * scope.radius,
                     scope.centerY + Math.sin(angle) * scope.radius);
      context.stroke();
    }

    function drawGrid(context, scope) {
      context.lineWidth = 1;
      for (let ring = 1; ring <= RANGE_RINGS; ring++) {
        context.beginPath();
        context.arc(scope.centerX, scope.centerY, scope.radius * ring / RANGE_RINGS, 0, 2 * Math.PI);
        context.strokeStyle = green(ring === RANGE_RINGS ? 0.6 : 0.25);
        context.stroke();
      }

      context.strokeStyle = green(0.6);
      RADAR_SECTIONS.forEach(section => drawLineFromCenter(context, scope, section.outerDeg));
      context.setLineDash([6, 6]);
      RADAR_SECTIONS.forEach(section => drawLineFromCenter(context, scope, section.innerDeg));
      context.setLineDash([]);
    }

    // direction: +1 = moving toward the inner edge, -1 = moving back out.
    function drawSweep(context, scope, section, travel, direction) {
      // Trail: 1-degree wedges behind the ray, dimmer further back, kept inside the section.
      const spanDeg = Math.abs(turnDeg(section.outerDeg, section.innerDeg));
      const travelledDeg = travel * spanDeg;
      const clampToSpan = deg => Math.min(Math.max(deg, 0), spanDeg);
      for (let step = 0; step < SWEEP_TRAIL_DEG; step++) {
        const nearDeg = rayAngleDeg(section, clampToSpan(travelledDeg - direction * step) / spanDeg);
        const farDeg = rayAngleDeg(section, clampToSpan(travelledDeg - direction * (step + 1)) / spanDeg);
        const wedgeDeg = turnDeg(nearDeg, farDeg);
        if (wedgeDeg === 0) break; // trail reached the edge of the section
        const startDeg = wedgeDeg > 0 ? nearDeg : farDeg; // canvas arcs go clockwise
        context.beginPath();
        context.moveTo(scope.centerX, scope.centerY);
        context.arc(scope.centerX, scope.centerY, scope.radius,
          compassToCanvasRadians(startDeg),
          compassToCanvasRadians(startDeg + Math.abs(wedgeDeg)));
        context.closePath();
        context.fillStyle = green(0.35 * (1 - step / SWEEP_TRAIL_DEG));
        context.fill();
      }

      // Ray
      context.strokeStyle = green(1);
      context.lineWidth = 2;
      drawLineFromCenter(context, scope, rayAngleDeg(section, travel));
    }

    function drawBlips(context, scope, now) {
      // Drop faded blips
      while (blips.length && now - blips[0].bornMs > BLIP_FADE_MS) blips.shift();

      blips.forEach(blip => {
        const fade = 1 - (now - blip.bornMs) / BLIP_FADE_MS; // 1 = fresh, 0 = gone
        const angle = compassToCanvasRadians(blip.angleDeg);
        const distance = scope.radius * blip.step / DISTANCE_STEPS;
        context.beginPath();
        context.arc(scope.centerX + Math.cos(angle) * distance,
                    scope.centerY + Math.sin(angle) * distance,
                    blip.radiusPx, 0, 2 * Math.PI);
        context.fillStyle = green(fade);
        context.shadowColor = green(fade);
        context.shadowBlur = 12; // phosphor glow
        context.fill();
        context.shadowBlur = 0;
      });
    }

    const canvas = document.getElementById('radar-canvas');
    const context = canvas.getContext('2d');

    function drawScope(travel, direction, now) {
      // Match the canvas to its on-screen size at device resolution (sharp on high-DPI phones).
      const pixelRatio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (canvas.width !== width * pixelRatio || canvas.height !== height * pixelRatio) {
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
      }
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.fillStyle = '#000';
      context.fillRect(0, 0, width, height);

      const scope = {
        centerX: width / 2,
        centerY: height / 2,
        radius: Math.min(width, height) / 2 - CIRCLE_MARGIN_PX,
      };
      drawGrid(context, scope);
      RADAR_SECTIONS.forEach(section => drawSweep(context, scope, section, travel, direction));
      drawBlips(context, scope, now);
    }

    // ---- Animation loop ----

    const sweepStartMs = performance.now();
    let previousTravel = -1;

    function animate(now) {
      // phase 0..1 = rays moving in (outer -> inner), 1..2 = moving back out.
      const phase = ((now - sweepStartMs) % (2 * SWEEP_PERIOD_MS)) / SWEEP_PERIOD_MS;
      const direction = phase < 1 ? 1 : -1;
      const travel = phase < 1 ? phase : 2 - phase;
      addBlipsCrossed(previousTravel, travel, now);
      previousTravel = travel;

      drawScope(travel, direction, now);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
